openapi: 3.0.3
info:
  title: NoxaPlus Pet Store
  version: 1.3.0
  description: A small example API used to demonstrate SpecForge CRUD, filters, latency, and error simulation.
servers:
  - url: https://api.example.com/v1
    description: Example production server
tags:
  - name: pets
    description: Pet records
  - name: system
    description: Service health
paths:
  /pets:
    get:
      tags: [pets]
      operationId: listPets
      summary: List pets with optional filters and pagination
      parameters:
        - name: species
          in: query
          schema:
            type: string
            enum: [dog, cat, bird, rabbit]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A page of pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetList'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [pets]
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [pets]
      operationId: getPet
      summary: Get one pet by id
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [pets]
      operationId: replacePet
      summary: Replace a pet record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '200':
          description: Replaced pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [pets]
      operationId: updatePet
      summary: Update selected fields of a pet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetPatch'
      responses:
        '200':
          description: Updated pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [pets]
      operationId: deletePet
      summary: Delete a pet
      responses:
        '204':
          description: Deleted
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}/photo:
    get:
      tags: [pets]
      operationId: getPetPhoto
      summary: Generate a photo response for a pet
      responses:
        '200':
          description: Photo metadata
          content:
            application/json:
              schema:
                type: object
                required: [url, width, height]
                properties:
                  url:
                    type: string
                    format: uri
                  width:
                    type: integer
                    minimum: 200
                    maximum: 1600
                  height:
                    type: integer
                    minimum: 200
                    maximum: 1600
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Service health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptime:
                    type: number
                    minimum: 1
                    maximum: 9999
components:
  schemas:
    Pet:
      type: object
      required: [id, name, species]
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 40
        species:
          type: string
          enum: [dog, cat, bird, rabbit]
        age:
          type: integer
          minimum: 0
          maximum: 30
        vaccinated:
          type: boolean
        owner:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
        tags:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    PetInput:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 40
        species:
          type: string
          enum: [dog, cat, bird, rabbit]
        age:
          type: integer
          minimum: 0
          maximum: 30
        vaccinated:
          type: boolean
        tags:
          type: array
          items:
            type: string
    PetPatch:
      type: object
      properties:
        name:
          type: string
        species:
          type: string
          enum: [dog, cat, bird, rabbit]
        age:
          type: integer
    PetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        total:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
            message:
              type: string
  responses:
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
